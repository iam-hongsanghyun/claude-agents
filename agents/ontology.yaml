# ---------------------------------------------------------------------------
# WORKFLOWS — named sequences the edges above compose into
# ---------------------------------------------------------------------------
workflows:
  - id: contracted-engagement
    steps:
      - research-director (Inception → charter, confirm with user)
      - research-director (Design → phases, stages, process, toolbox)
      - research-director (Team → roster; new agents only for real gaps)
      - consultant (inception pack, data + decision requests)
      - "per stage: stage owners → review chain → research-director (Tracking) → report-manager (governance + dashboards)"
      - "at each gate: research-director (Conformance) → report-manager → consultant"
  - id: refresh-after-data-or-logic-update
    steps:
      - research-director (Refresh 6.1-6.2 → fingerprint every stage's declared inputs)
      - research-director (Refresh 6.3 → stale set + transitive downstream closure, topological order)
      - "re-run only that closure: stage owners → review chain (re-armed; re-run figures revert to [compute])"
      - "skipped stages recorded with the fingerprint that proves the skip"
      - research-director (Refresh 6.4 → iterate to a fixpoint, max five sweeps)
      - research-director (Conformance, if the charter/contract changed) → research-director (Tracking)
      - report-manager (dashboards) → consultant (if a figure already went to the client)
      - "research-director writes .claude/skills/<project>-refresh/SKILL.md so the next refresh is one invocation"
  - id: interim-reporting
    steps:
      - "step-by-step, not once at the end: fires at every process-step completion, stage exit and phase gate"
      - "research-director decides which units need a log report, a result report, or `result: n/a — no analytical output`"
      - "log-reporter writes reports/log/<unit>/ — what was done, what failed, commands, fingerprints, deviations, reproduction"
      - "result-reporter writes reports/result/<unit>/ — the journal article: why, data handling, statistics, methods, results"
      - "visualizer builds every figure, both .html families, the conference decks and the two indexes — offline, deterministic"
      - "review chain gates each number [compute] -> [verified]; neither reporter marks its own"
      - "provenance-auditor clears licence and trace before the result set travels; consultant frames any deck going to a client"
      - "research-director gates completeness and names the incomplete units — it writes neither family"
      - "after any Pass 6 refresh, the refreshed units' figures revert to [compute] and their decks are rebuilt"
  - id: feature-development
    steps:
      - planner-and-qc-lead
      - developer / frontend-developer / web-app-engineer
      - math-reviewer (if math changed) / optimization-modeller (if LP/MILP changed)
      - data-scientist (if data I/O changed) / visualizer (if charts)
      - tester (mechanical gate)
      - reviewer (judgment gate, before commit)
      - auditor (before merge)
  - id: bug-fix
    steps: [debugger, developer / frontend-developer, tester, reviewer, auditor]
  - id: refactor
    steps: [refactor-architect, auditor]
  - id: research-to-report
    steps: [energy-finance-team / investment-asset-team, writing-support-team]
  - id: data-pipeline
    steps: [kr-power-data-scout, data-collector, source-reconciliation-analyst, provenance-auditor, data-scientist]
  - id: energy-model
    steps: [kr-power-data-scout, data-collector, renewable-resource-scientist, optimization-modeller, math-reviewer, visualizer]
  - id: llm-application
    steps: [agent-app-engineer, mcp-server-engineer, web-app-engineer, tester, reviewer]
  - id: mcp-surface
    steps: [mcp-server-engineer, tester, reviewer, app-distribution-engineer]
  - id: before-publishing
    steps: [provenance-auditor, auditor, research-director (Conformance)]
