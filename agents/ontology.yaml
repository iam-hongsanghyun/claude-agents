# Agent ontology — the single source of truth for how this pack's agents relate.
#
# Nodes are agents; edges are typed relationships. ONTOLOGY.md is GENERATED from this
# file by `scripts/render_ontology.py` — edit here, never there. Keep one fact in one place:
# an agent's routing boundaries live in its own `description` frontmatter and are mirrored
# here as `delegates_to` edges; if the two disagree, the frontmatter wins and this file is
# wrong. `scope: user` agents install to ~/.claude/agents; `scope: project` agents live in
# a single engagement's .claude/agents and are mirrored under agents/project/ for visibility.

meta:
  title: Agent Ontology
  pack_size_user_level: 32
  project_agents: 12

tiers:
  - id: "0"
    name: Engagement governance
    when: Work bound by a contract, proposal, or funding agreement; artefacts under claude-docs/.
  - id: "1"
    name: Workflow orchestration
    when: The start of any non-trivial task — plan, decompose, route.
  - id: "2"
    name: "Code: writing & review"
    when: Writing code and the gates that guard it before merge.
  - id: "3"
    name: "Code: domain specialists"
    when: Code in a specific modelling or engineering domain.
  - id: "4"
    name: "Research & analysis (no code)"
    when: Desk research and written deliverables; no code.

# Only edge types the graph actually uses are defined here. Tier-0 governance and the
# read-only review relation are already expressed by the tier structure and by
# `gates` / `hands_off_to`, so they get no separate vocabulary.
relation_types:
  hands_off_to: A produces work B takes as its input in a standard workflow (a direction of flow).
  gates: A is a mandatory pass/fail check that must clear before B proceeds.
  delegates_to: A's own description routes a neighbouring task away to B ("NOT for X — use B").
  pairs_with: A and B collaborate on one task, neither downstream of the other (symmetric).
  authored: A (research-director) created this project-scoped agent for one engagement.
  specializes: a project-scoped agent is a narrowed, engagement-bound form of user-level B.
  generalized_as: a project-scoped agent was distilled into user-level agent B (use B for new work).

# ---------------------------------------------------------------------------
# NODES
# ---------------------------------------------------------------------------
agents:
  # Tier 0 — engagement governance
  - {id: research-director, tier: "0", scope: user, model: opus,   access: read-write, role: "Owns research design & governance from the contract — charter, phases, stages, process, toolbox, tracker, team, and the reports/ record set"}
  - {id: consultant,        tier: "0", scope: user, model: opus, access: read-write, role: "The only customer-facing role — engagement + plain-language translation; drafts only, never sends, never accepts scope"}
  - {id: report-manager,    tier: "0", scope: user, model: opus, access: read-write, role: "Process-conformance governance + generated HTML progress & team dashboards; reads the docs, never edits them"}
  - {id: log-reporter,      tier: "0", scope: user, model: opus, access: read-write, role: "The log report per unit — what was done and what failed: commands, environment, fingerprints, dead ends, deviations, reproduction"}
  - {id: result-reporter,   tier: "0", scope: user, model: opus, access: read-write, role: "The result report per unit — the analysis as a journal article, plus a conference-presentation deck; data handling, statistics, figures"}

  # Tier 1 — orchestration
  - {id: planner-and-qc-lead, tier: "1", scope: user, model: opus, access: read-only, role: "Plans a non-trivial task, decomposes it into reviewable steps, produces a QC checklist, routes to agents"}

  # Tier 2 — code: writing & review
  - {id: developer,          tier: "2", scope: user, model: opus, access: read-write, role: "Implements/refactors/documents scientific-modelling Python to CLAUDE.md conventions"}
  - {id: frontend-developer, tier: "2", scope: user, model: opus, access: read-write, role: "Rich React + TypeScript + Vite modelling-GUI browser client"}
  - {id: web-app-engineer,   tier: "2", scope: user, model: opus, access: read-write, role: "No-build vanilla-JS/d3 web apps + thin FastAPI/http.server backend + static/Vercel deploy"}
  - {id: tester,             tier: "2", scope: user, model: sonnet,  access: read-only,  role: "Mechanical build gate — tsc/mypy, compile, plain ruff, emoji scan, tests; pass/fail only"}
  - {id: reviewer,           tier: "2", scope: user, model: opus, access: read-only,  role: "APPROVE/REJECT a diff against the one task asked; scope creep, duplication, contract"}
  - {id: math-reviewer,      tier: "2", scope: user, model: opus, access: read-only,  role: "Verifies code vs Algorithm docstrings & ALGORITHM.md — stability, signs, indexing, tolerances"}
  - {id: auditor,            tier: "2", scope: user, model: opus, access: read-only,  role: "Pre-merge code audit — no hardcoded values, config externalised, pint, tooling, layout"}
  - {id: provenance-auditor, tier: "2", scope: user, model: opus, access: read-only,  role: "Data-provenance & republication-licence audit; every figure traces; clean-checkout reproducibility"}
  - {id: refactor-architect, tier: "2", scope: user, model: opus, access: read-write, role: "Behavior-preserving restructure — extract, deduplicate, reduce coupling, remove dead code"}
  - {id: debugger,           tier: "2", scope: user, model: opus, access: read-write, role: "Reproduce → isolate root cause → minimal fix; failing test before the fix"}

  # Tier 3 — code: domain specialists
  - {id: data-scientist,                tier: "3", scope: user, model: opus, access: read-write, role: "EDA, statistics, ML prototyping in code; schema/dtype/unit alignment; parquet > CSV"}
  - {id: optimization-modeller,         tier: "3", scope: user, model: opus, access: read-write, role: "LP/MILP/NLP + PyPSA network construction, power flow (n.pf()) and calibration"}
  - {id: system-dynamics-modeller,      tier: "3", scope: user, model: opus, access: read-write, role: "Stock-and-flow feedback simulation — integration, loop dominance, Vensim/.mdl"}
  - {id: computational-economist,       tier: "3", scope: user, model: opus, access: read-write, role: "Equilibrium & mechanism modelling — PE/GE, Nash-Cournot, Hotelling, carbon markets"}
  - {id: renewable-resource-scientist,  tier: "3", scope: user, model: opus, access: read-write, role: "Wind/solar resource from reanalysis — hub-height extrapolation, bias correction, capacity factors"}
  - {id: climate-risk-modeller,         tier: "3", scope: user, model: opus, access: read-write, role: "CLIMADA physical risk (hazard×exposure×vulnerability, EAI) + NGFS transition risk"}
  - {id: agent-app-engineer,            tier: "3", scope: user, model: opus, access: read-write, role: "LLM/agent applications — Agent SDK, provider abstraction, guards, budgets, RAG, eval"}
  - {id: gis-analyst,                   tier: "3", scope: user, model: opus, access: read-write, role: "Geospatial code — CRS, spatial joins, raster/vector, choropleth binning"}
  - {id: data-collector,                tier: "3", scope: user, model: opus, access: read-write, role: "Ingestion pipelines — scrapers/APIs, schema validation, retry/backoff, idempotent storage"}
  - {id: source-reconciliation-analyst, tier: "3", scope: user, model: opus, access: read-write, role: "Reconcile disagreeing sources; record the rule; preserve the losing value; gate on tolerance"}
  - {id: mcp-server-engineer,           tier: "3", scope: user, model: opus, access: read-write, role: "MCP server tool surface — granularity, schemas, recoverable errors, output budgeting, parity"}
  - {id: app-distribution-engineer,     tier: "3", scope: user, model: opus, access: read-write, role: "Double-click .command/.bat/.ps1 launchers for non-technical users; first-run bootstrap"}
  - {id: visualizer,                    tier: "3", scope: user, model: opus, access: read-write, role: "Charts/maps/dashboards in code — matplotlib/seaborn/plotly/folium/pydeck; builds the research report pages and their index"}
  - {id: doc-writer,                    tier: "3", scope: user, model: opus, access: read-write, role: "Code-facing docs — README, CLI manuals, tutorials, ARCHITECTURE, CONTRIBUTING"}

  # Tier 4 — research & analysis (no code)
