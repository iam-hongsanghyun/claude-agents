  - {id: investment-asset-team, tier: "4", scope: user, model: opus, access: research, role: "Portfolio/equity/bond/credit/risk research → structured investment report"}
  - {id: kr-power-data-scout,   tier: "4", scope: user, model: opus, access: research, role: "Korean datasets + what a metric actually measures (설비 vs 발전, 발전단 vs 송전단, SMP vs 정산단가)"}
  - {id: writing-support-team,  tier: "4", scope: user, model: opus, access: research, role: "Reports, white papers, briefs, memos, presentations; parallel KO/EN with a terminology glossary"}

  # Project-scoped — mirrored under agents/project/, NOT installed globally
  - {id: maritime-regulation-analyst, tier: "3", scope: project, project: IRI-P1, model: opus,   access: read-write, role: "Primary-source IMO regulation — adopted vs draft text, GFI/RU/SU basis, vessel-activity data"}
  - {id: shipping-transition-expert,  tier: "3", scope: project, project: IRI-P1, model: opus,   access: read-write, role: "Marine-fuel transition sector authority; carries PLANiT's published shipping position; produces no figure"}
  - {id: data-analyst,                tier: "3", scope: project, project: IRI-P1, model: opus,   access: read-write, role: "Transcription-with-provenance into a sqlite register — verbatim quote + exact locator; refuses to fill a gap"}
  - {id: resource-scientist,          tier: "3", scope: project, project: OEP-OffshoreWind, model: opus,   access: read-write, role: "Offshore-wind resource module — ERA5, shear, bias correction vs buoys, capacity factors"}
  - {id: system-value-analyst,        tier: "3", scope: project, project: OEP-OffshoreWind, model: opus,   access: read-write, role: "System LCOE, curtailment, LCoS, surplus absorption — metrics as differences between scenarios"}
  - {id: dispatch-engineer,           tier: "3", scope: project, project: OEP-OffshoreWind, model: opus,   access: read-write, role: "KPG193 network build, 2024 calibration gate, scenario encoding, ensembled run matrix"}
  - {id: data-acquisition-engineer,   tier: "3", scope: project, project: OEP-OffshoreWind, model: sonnet, access: read-write, role: "SKR-0008 acquisition layer — fetchers + credential broker + human-input inbox; always a manifest"}
  - {id: korea-policy-strategist,     tier: "4", scope: project, project: OEP-OffshoreWind, model: opus,   access: read-write, role: "Storyline for MCEE/KPX/National-Assembly audiences; the three contract-required Korea insights"}
  - {id: oep-contract-compliance,     tier: "0", scope: project, project: OEP-OffshoreWind, model: sonnet, access: read-only,  role: "Pre-submission PASS/BLOCK vs Schedules 1/2/3, payment gateways, KPIs"}
  - {id: pipeline-orchestrator,       tier: "1", scope: project, project: OEP-OffshoreWind, model: opus,   access: read-write, role: "START HERE project lead — reads pipeline state, dispatches to role agents, batches asks"}
  - {id: interim-reporter,            tier: "0", scope: project, project: OEP-OffshoreWind, model: sonnet, access: read-write, role: "Stage reports that lead with the ask and are honest about failure"}
  - {id: leader,                      tier: "1", scope: project, project: project_bifrost, model: inherit, access: read-write, role: "Feature triage → scoped task to developer → reviewer → commit/push/merge"}

